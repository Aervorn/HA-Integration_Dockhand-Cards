# Fork maintenance: keeps this fork on top of raetha/ha-dockhand-cards.
#
# Every night it replays this fork's own commits on top of upstream's main.
# When upstream has published a new vX.Y.Z tag, it also builds and publishes
# a matching release here (vX.Y.Z-yj) so HACS offers the update.
# If the rebase conflicts or the tests fail, nothing is pushed and an issue
# is opened in this fork instead.
#
# Needs a repository secret SYNC_TOKEN: a fine-grained personal access token
# on this repository with Contents, Workflows and Issues set to read/write.
# (The default GITHUB_TOKEN cannot push commits that touch workflow files,
# which upstream's own commits sometimes do.)

name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish a release for the latest upstream tag even if it already exists here"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/raetha/ha-dockhand-cards.git
  SUFFIX: yj

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main --tags

      # The fork's README is not kept as a hand-edited commit (it would conflict
      # whenever upstream edits its README). Instead the last commit, marked
      # [fork-readme], is regenerated on every run by .github/fork/patch_readme.py:
      # it is dropped before the rebase and rebuilt from upstream's README after.
      - name: Rebase fork commits onto upstream
        id: rebase
        run: |
          if GIT_SEQUENCE_EDITOR="sed -i -E '/\[fork-readme\]/s/^pick /drop /'" git rebase -i upstream/main; then
            echo "Rebased."
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Regenerate the fork README
        run: |
          python3 .github/fork/patch_readme.py
          git add README.md
          git commit -q -m "docs: fork README [fork-readme]" -m "Generated by .github/fork/patch_readme.py from upstream's README."

      - name: Did anything change?
        id: changes
        run: |
          if git diff --quiet origin/main HEAD; then
            echo "No change against origin/main."
            git reset -q --hard origin/main
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Typecheck, lint, test and build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Push rebased main
        if: steps.changes.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:main

      - name: Work out release tag
        id: tag
        run: |
          UP_TAG=$(git tag --merged upstream/main --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$UP_TAG" ]; then echo "No upstream release tag found."; exit 0; fi
          FORK_TAG="${UP_TAG}-${SUFFIX}"
          echo "fork_tag=$FORK_TAG" >> "$GITHUB_OUTPUT"
          echo "up_tag=$UP_TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$FORK_TAG" >/dev/null && [ "${{ inputs.force_release }}" != "true" ]; then
            echo "$FORK_TAG already published."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.tag.outputs.release == 'true'
        run: |
          git tag -f "${{ steps.tag.outputs.fork_tag }}"
          git push -f origin "refs/tags/${{ steps.tag.outputs.fork_tag }}"

      - name: Publish release
        if: steps.tag.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          tag_name: ${{ steps.tag.outputs.fork_tag }}
          name: "Dockhand Cards ${{ steps.tag.outputs.fork_tag }}"
          body: |
            Upstream ${{ steps.tag.outputs.up_tag }} (raetha/ha-dockhand-cards) with this fork's changes:
            start / stop / restart / deploy controls shown as icons in the card header.

            Upstream notes: https://github.com/raetha/ha-dockhand-cards/releases/tag/${{ steps.tag.outputs.up_tag }}
          files: |
            dist/ha-dockhand-cards.js
            dist/ha-dockhand-cards-editor.js
          draft: false
          prerelease: false
          make_latest: true

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ "${{ steps.rebase.outputs.conflict }}" = "true" ]; then
            TITLE="Upstream sync: rebase conflict"
            BODY="Replaying the fork's commits onto upstream/main conflicted in:\n\n\`\`\`\n$(cat /tmp/conflicts.txt)\n\`\`\`\n\nResolve locally: \`git fetch upstream && git rebase upstream/main\`, fix, then \`git push --force-with-lease\`."
          else
            TITLE="Upstream sync: checks failed"
            BODY="The rebase onto upstream succeeded but typecheck, lint, tests or build failed. Nothing was pushed."
          fi
          BODY="$BODY\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if ! gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$TITLE" --body "$(printf '%b' "$BODY")"
          fi
